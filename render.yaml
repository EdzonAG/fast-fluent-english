# Render Blueprint — free static sites, no build step.
# https://render.com/docs/blueprint-spec
#
# One static site for spectacultours.mx:
#   /                      SpectaCulTours home (all expeditions)
#   /chiapas/              Chiapas expedition
#   /baja-california-sur/  Baja California Sur expedition
#   /english/              FAST fluent English (English classes, secondary)
#
# Custom domain: add spectacultours.mx and www.spectacultours.mx in the
# service's Settings → Custom Domains and create the DNS records Render shows.
services:
  - type: web
    name: fast-fluent-english
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600
    # Old URLs from the first version (tours lived under /tours/).
    routes:
      - type: redirect
        source: /tours/chiapas/*
        destination: /chiapas/
      - type: redirect
        source: /tours/baja-california-sur/*
        destination: /baja-california-sur/
      - type: redirect
        source: /tours/*
        destination: /
      - type: redirect
        source: /tours
        destination: /
