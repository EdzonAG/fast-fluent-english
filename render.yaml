# Render Blueprint: sitio estático con un build pequeño.
# https://render.com/docs/blueprint-spec
#
# Un solo sitio para spectacultours.mx:
#   /                      portada de SpectaCulTours
#   /chiapas/              expedición Chiapas
#   /baja-california-sur/  expedición Baja California Sur
#   /english/              FAST fluent English (clases de inglés, secundario)
#
# Importante: este archivo solo se aplica si el servicio está ligado al Blueprint.
# El servicio actual se creó a mano, así que hay que ligarlo o copiar estos valores
# en Settings del panel (ver README).
services:
  - type: web
    name: fast-fluent-english
    runtime: static
    buildCommand: npm ci --omit=dev && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Archivos con hash en el nombre: nunca cambian.
      # El HTML y el resto conservan el valor de Render (max-age=0, revalidación).
      # La compresión Brotli la aplica Render en HTML, CSS, JS y SVG.
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # URLs antiguas de la primera versión (los tours vivían en /tours/).
    routes:
      - type: redirect
        source: /tours/chiapas/*
        destination: /chiapas/
      - type: redirect
        source: /tours/baja-california-sur/*
        destination: /baja-california-sur/
      - type: redirect
        source: /tours/*
        destination: /
      - type: redirect
        source: /tours
        destination: /
